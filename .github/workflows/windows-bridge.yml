name: Windows — puente a Niihuel

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Rama del repositorio nuevo
        required: true
        default: release/1.15.2-railway
      version:
        description: Versión semántica
        required: true
        default: 1.15.2

permissions:
  contents: read

jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Traer el código desde Niihuel
        uses: actions/checkout@v4
        with:
          repository: Niihuel/dnmusic
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TARGET_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Validar configuración de producción
        shell: bash
        env:
          URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          ANON: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          MUSICA: ${{ secrets.EXPO_PUBLIC_MUSIC_API }}
        run: |
          test "$URL" = 'https://envoy-production-2fb6.up.railway.app'
          test "$MUSICA" = 'https://dnmusic-production-c3f4.up.railway.app'
          test -n "$ANON"

      - name: Dependencias y web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_MUSIC_API: ${{ secrets.EXPO_PUBLIC_MUSIC_API }}
        run: npm ci && npm run build:web

      - name: Preparar escritorio
        working-directory: desktop
        run: |
          npm ci
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
          npm run build
          npm run traer-web
          node scripts/notas-release.mjs "${{ inputs.version }}"

      - name: Retirar assets parciales de Windows
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TARGET_TOKEN }}
        run: |
          for asset in \
            "dnmusic-${{ inputs.version }}-instalador.exe" \
            "dnmusic-${{ inputs.version }}-instalador.exe.blockmap" \
            latest.yml
          do
            gh release delete-asset "v${{ inputs.version }}" "$asset" \
              --repo Niihuel/dnmusic-releases --yes || true
          done

      - name: Empaquetar y publicar Windows en Niihuel
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.TARGET_TOKEN }}
        run: npx electron-builder --win --publish always
